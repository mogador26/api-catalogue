# Site du catalogue des API (contenu statique MkDocs)
server {
    listen 8080;
    # IPv6 : décommenter si le réseau du conteneur le prend en charge
    # listen [::]:8080;
    server_name _;

    # Redirections relatives : correctes derrière un mappage de port ou un proxy
    absolute_redirect off;

    root  /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (répétés dans chaque location qui ajoute ses propres en-têtes)
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sonde de santé (HEALTHCHECK, Kubernetes)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ressources statiques : cache navigateur
    location ~* \.(?:css|js|woff2?|ttf|svg|png|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Spécifications OpenAPI : pas de cache (elles évoluent avec les API)
    location /openapi/ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages : URL « répertoire » de MkDocs (use_directory_urls)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
