# =============================================================================
# Headers de sécurité OWASP pour Nginx
# Basé sur les recommandations OWASP ASVS et CIS Benchmark
# =============================================================================

# -----------------------------------------------------------------------------
# Headers HTTP de sécurité standard
# -----------------------------------------------------------------------------

# X-Frame-Options : Empêcher le clickjacking
# DENY : Empêche totalement l'affichage dans un iframe
# SAMEORIGIN : Autorise uniquement dans un iframe du même domaine
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options : Empêcher le MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection : Activer le filtre XSS du navigateur
# 1 : Activer le filtre
# mode=block : Bloquer le rendu de la page si attaque détectée
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy : Contrôler les informations envoyées dans le header Referer
# no-referrer : Ne jamais envoyer le Referer
# strict-origin-when-cross-origin : Envoyer l'origine uniquement pour same-origin
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy (anciennement Feature-Policy)
# Contrôler les fonctionnalités du navigateur accessibles
add_header Permissions-Policy \
    "geolocation=(), \
     microphone=(), \
     camera=(), \
     payment=(), \
     usb=(), \
     vr=(), \
     accelerometer=(), \
     gyroscope=(), \
     magnetometer=(), \
     fullscreen=(self), \
     sync-xhr=(self)" \
    always;

# -----------------------------------------------------------------------------
# Content Security Policy (CSP) - Protection contre XSS
# -----------------------------------------------------------------------------
# Note : CSP doit être adapté selon les besoins réels de l'application
# Cette configuration est un point de départ sécurisé

add_header Content-Security-Policy \
    "default-src 'self'; \
     script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; \
     style-src 'self' 'unsafe-inline' https:; \
     img-src 'self' data: https:; \
     font-src 'self' https:; \
     connect-src 'self' https:; \
     frame-src 'none'; \
     object-src 'none'; \
     media-src 'self' https:; \
     form-action 'self'; \
     frame-ancestors 'none'; \
     base-uri 'self'; \
     block-all-mixed-content; \
     upgrade-insecure-requests" \
    always;

# CSP pour les rapports d'erreurs (optionnel, nécessite une configuration serveur)
# add_header Content-Security-Policy-Report-Only "...; report-uri /csp-violations;" always;

# -----------------------------------------------------------------------------
# Strict-Transport-Security (HSTS) - Forcer HTTPS
# -----------------------------------------------------------------------------
# NOTE : HSTS ne doit être activé que si le site est accessible UNIQUEMENT en HTTPS
# Pour un site en développement ou accessible en HTTP, commenter cette ligne
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# -----------------------------------------------------------------------------
# Headers supplémentaires pour la sécurité
# -----------------------------------------------------------------------------

# Cache-Control pour les pages sensibles
# Empêcher la mise en cache des pages authentifiées
map $request_uri $no_cache {
    default 0;
    ~*/login 1;
    ~*/admin 1;
}

# Expect-CT : Certificate Transparency (optionnel, nécessite HTTPS)
# add_header Expect-CT "max-age=86400, enforce" always;

# Server : Masquer les informations du serveur (déjà géré par server_tokens off)
# La directive server_tokens off dans nginx.conf suffit

# -----------------------------------------------------------------------------
# Protection contre les attaques spécifiques
# -----------------------------------------------------------------------------

# Désactiver les méthodes TRACE et TRACK
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

